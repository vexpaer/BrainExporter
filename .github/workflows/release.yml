name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "::error::Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "v${APP_VERSION}" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v${APP_VERSION}"
            exit 1
          fi
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in GitHub Actions secrets"
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brainexporter-release.jks"
          chmod 600 "$RUNNER_TEMP/brainexporter-release.jks"

      - name: Test, lint and build signed release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test lint :app:assembleRelease \
            -PSIGNING_KEYSTORE="$RUNNER_TEMP/brainexporter-release.jks" \
            -PSIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PSIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
            -PSIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD"

      - name: Verify APK and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="BrainExporter-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: BrainExporter-${{ github.ref_name }}
          path: |
            BrainExporter-${{ github.ref_name }}.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "BrainExporter-${GITHUB_REF_NAME}.apk" \
            SHA256SUMS.txt \
            --verify-tag \
            --title "BrainExporter $GITHUB_REF_NAME" \
            --generate-notes

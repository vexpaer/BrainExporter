name: Publish BrainExporter v0.5.0

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"

permissions:
  contents: write

concurrency:
  group: publish-brainexporter-v0.5.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'vexpaer/BrainExporter'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version, tag and signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*versionCode = 5$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "0.5.0"$' app/build.gradle.kts
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.5.0" >/dev/null 2>&1; then
            echo "::error::Tag v0.5.0 already exists; refusing to overwrite."
            exit 1
          fi
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brainexporter-release.jks"
          chmod 600 "$RUNNER_TEMP/brainexporter-release.jks"

      - name: Test, lint and build signed release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test lint :app:assembleRelease \
            -PSIGNING_KEYSTORE="$RUNNER_TEMP/brainexporter-release.jks" \
            -PSIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PSIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
            -PSIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD"

      - name: Verify signed APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk BrainExporter-v0.5.0.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs BrainExporter-v0.5.0.apk
          sha256sum BrainExporter-v0.5.0.apk > SHA256SUMS.txt

      - name: Create release tag and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v0.5.0" \
            -f sha="$GITHUB_SHA"
          gh release create v0.5.0 \
            BrainExporter-v0.5.0.apk SHA256SUMS.txt \
            --verify-tag \
            --title "BrainExporter v0.5.0" \
            --notes-file <(sed -n '/^## 0.5.0/,/^## 0.3.0/p' CHANGELOG.md | sed '$d')

      - name: Upload release artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: BrainExporter-v0.5.0
          path: |
            BrainExporter-v0.5.0.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
